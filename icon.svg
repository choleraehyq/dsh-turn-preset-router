<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Turn Preset Router">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#12161f"/>
  <!-- incoming turn -->
  <circle cx="14" cy="32" r="4.5" fill="#7dd3fc"/>
  <!-- fork into three routes -->
  <path d="M18.5 32h9" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M27 32c6 0 6-13 12-13h6" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M27 32h18" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M27 32c6 0 6 13 12 13h6" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round"/>
  <!-- mode terminals: standard / ptc / minimal -->
  <rect x="45" y="15" width="7" height="7" rx="2" fill="#a7f3d0"/>
  <rect x="45" y="28.5" width="7" height="7" rx="2" fill="#fde68a"/>
  <rect x="45" y="42" width="7" height="7" rx="2" fill="#fca5a5"/>
